name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

concurrency:
  group: 52etf-deploy
  cancel-in-progress: false

jobs:
  # 检测本次变更涉及 backend 还是 frontend；手动触发时两侧都会部署。
  detect:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  deploy-backend:
    name: Deploy backend
    needs: detect
    if: needs.detect.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 服务已迁移到本机(Rich)：52etf.vip 域名不变，SSH 经 frps 6022 端口转发到本机
      ECS_HOST: 52etf.vip
      ECS_PORT: "6022"
      ECS_USER: quantd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m venv .flow-build-venv
          ./.flow-build-venv/bin/pip install -U pip

      # 拆成两个产物：源码（小，每次上传）+ 依赖（大，仅 requirements.txt 变化时上传）。
      - name: Build deploy artifacts
        id: build-package
        run: |
          set -euo pipefail

          REQ_HASH="$(sha256sum requirements.txt | awk '{print $1}')"
          PY_TAG="$(.flow-build-venv/bin/python - <<'PY'
          import sys
          print(f"py{sys.version_info.major}{sys.version_info.minor}")
          PY
          )"
          DEPS_DIR=".flow-deps/${PY_TAG}-${REQ_HASH}"

          if [ ! -d "$DEPS_DIR" ]; then
            echo "[build] dependency cache miss: $DEPS_DIR"
            tmp_dir="${DEPS_DIR}.tmp"
            rm -rf "$tmp_dir"
            mkdir -p "$tmp_dir"
            .flow-build-venv/bin/python -m pip install --target "$tmp_dir" -r requirements.txt
            mkdir -p .flow-deps
            mv "$tmp_dir" "$DEPS_DIR"
          else
            echo "[build] dependency cache hit: $DEPS_DIR"
          fi

          # 依赖包（体积大，仅当 requirements.txt 变化时才上传）
          tar czf deps.tgz -C "$DEPS_DIR" .

          # 源码（体积小，每次部署都上传）
          rm -rf src_stage
          mkdir -p src_stage
          cp -r src src_stage/src
          touch src_stage/src/__init__.py
          tar czf src.tgz -C src_stage src
          rm -rf src_stage

          echo "req_hash=${REQ_HASH}" >> "$GITHUB_OUTPUT"
          ls -lh deps.tgz src.tgz

      - name: Prepare SSH key
        shell: bash
        run: |
          if [ -z "${{ secrets.ECS_SSH_KEY }}" ]; then
            echo "ECS_SSH_KEY is empty. Please set the repository secret ECS_SSH_KEY."
            exit 1
          fi
          mkdir -p ~/.ssh
          touch ~/.ssh/deploy_key
          cat <<'EOF' > ~/.ssh/deploy_key
          ${{ secrets.ECS_SSH_KEY }}
          EOF
          perl -pi -e 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Loaded key fingerprints:"
          ssh-keygen -l -f ~/.ssh/deploy_key

      - name: Trust remote host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$ECS_PORT" -H "$ECS_HOST" >> ~/.ssh/known_hosts

      - name: Verify SSH access
        run: |
          ssh -i ~/.ssh/deploy_key -p "$ECS_PORT" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "${ECS_USER}@${ECS_HOST}" 'echo SSH_OK'

      # 服务器上记录了已部署的 requirements.txt 哈希（.deps-hash），只有哈希不一致才上传大体积依赖。
      - name: Check whether dependencies changed on server
        id: check-deps
        run: |
          REMOTE_HASH="$(ssh -i ~/.ssh/deploy_key -p "$ECS_PORT" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "${ECS_USER}@${ECS_HOST}" 'cat /home/quantd/quant_prod/backend/.deps-hash 2>/dev/null || true')"
          LOCAL_HASH="${{ steps.build-package.outputs.req_hash }}"
          echo "remote_hash=${REMOTE_HASH:-<none>}"
          echo "local_hash=${LOCAL_HASH}"
          if [ -n "$LOCAL_HASH" ] && [ "$REMOTE_HASH" = "$LOCAL_HASH" ]; then
            echo "deps_changed=false" >> "$GITHUB_OUTPUT"
            echo "Dependencies unchanged on server; only uploading source."
          else
            echo "deps_changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependencies changed (or first deploy); uploading dependencies too."
          fi

      - name: Upload artifacts to server
        run: |
          scp -i ~/.ssh/deploy_key -P "$ECS_PORT" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            src.tgz "${ECS_USER}@${ECS_HOST}:/home/quantd/src.tgz"
          if [ "${{ steps.check-deps.outputs.deps_changed }}" = "true" ]; then
            scp -i ~/.ssh/deploy_key -P "$ECS_PORT" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
              deps.tgz "${ECS_USER}@${ECS_HOST}:/home/quantd/deps.tgz"
          fi

      - name: Install and restart remote service
        run: |
          ssh -i ~/.ssh/deploy_key -p "$ECS_PORT" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "${ECS_USER}@${ECS_HOST}" bash -s -- "${{ steps.build-package.outputs.req_hash }}" <<'REMOTE'
          set -e
          REQ_HASH="$1"
          BACKEND=/home/quantd/quant_prod/backend
          if [ -f /home/quantd/deps.tgz ]; then
            echo "[deploy] replacing dependencies..."
            rm -rf "$BACKEND/site-packages.old"
            if [ -d "$BACKEND/site-packages" ]; then mv "$BACKEND/site-packages" "$BACKEND/site-packages.old"; fi
            mkdir -p "$BACKEND/site-packages"
            tar xzf /home/quantd/deps.tgz -C "$BACKEND/site-packages"
            rm -f "$BACKEND/.deps-hash"
            printf '%s' "$REQ_HASH" > "$BACKEND/.deps-hash"
            rm -f /home/quantd/deps.tgz
          fi
          echo "[deploy] replacing source..."
          rm -rf "$BACKEND/_src_extract"
          mkdir -p "$BACKEND/_src_extract"
          tar xzf /home/quantd/src.tgz -C "$BACKEND/_src_extract"
          rm -rf "$BACKEND/site-packages/src"
          mv "$BACKEND/_src_extract/src" "$BACKEND/site-packages/src"
          rmdir "$BACKEND/_src_extract" 2>/dev/null || true
          rm -f /home/quantd/src.tgz
          systemctl --user restart quant-server
          sleep 5
          systemctl --user --no-pager --lines=8 status quant-server
          if [ -d "$BACKEND/site-packages.old" ]; then rm -rf "$BACKEND/site-packages.old"; fi
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

  deploy-frontend:
    name: Deploy frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # 服务已迁移到本机(Rich)：52etf.vip 域名不变，SSH 经 frps 6022 端口转发到本机
      ECS_HOST: 52etf.vip
      ECS_PORT: "6022"
      ECS_USER: quantd
      ECS_REMOTE_DIR: /home/quantd/quant_prod/www
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --prefer-offline --no-audit --no-fund

      - name: Build frontend bundle
        run: |
          npm run build
          test -d build
          rm -f frontend.tgz
          tar czf frontend.tgz -C build .

      - name: Prepare SSH key
        shell: bash
        run: |
          if [ -z "${{ secrets.ECS_SSH_KEY }}" ]; then
            echo "ECS_SSH_KEY is empty. Please set the repository secret ECS_SSH_KEY."
            exit 1
          fi
          mkdir -p ~/.ssh
          touch ~/.ssh/deploy_key
          cat <<'EOF' > ~/.ssh/deploy_key
          ${{ secrets.ECS_SSH_KEY }}
          EOF
          perl -pi -e 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Loaded key fingerprints:"
          ssh-keygen -l -f ~/.ssh/deploy_key

      - name: Trust remote host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$ECS_PORT" -H "$ECS_HOST" >> ~/.ssh/known_hosts

      - name: Verify SSH access
        run: |
          ssh -i ~/.ssh/deploy_key -p "$ECS_PORT" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "${ECS_USER}@${ECS_HOST}" 'echo SSH_OK'

      - name: Upload bundle and replace remote web root
        run: |
          scp -i ~/.ssh/deploy_key -P "$ECS_PORT" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            frontend.tgz "${ECS_USER}@${ECS_HOST}:/home/quantd/frontend.tgz"

          ssh -i ~/.ssh/deploy_key -p "$ECS_PORT" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "${ECS_USER}@${ECS_HOST}" "set -e
          mkdir -p ${ECS_REMOTE_DIR}
          rm -rf ${ECS_REMOTE_DIR}/*
          tar xzf /home/quantd/frontend.tgz -C ${ECS_REMOTE_DIR}
          find ${ECS_REMOTE_DIR} -type d -exec chmod 755 {} +
          find ${ECS_REMOTE_DIR} -type f -exec chmod 644 {} +
          "

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
