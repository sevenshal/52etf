name: Frontend Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: 52etf-fe-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy 52etf frontend
    runs-on: ubuntu-latest
    env:
      ECS_HOST: 52etf.vip
      ECS_USER: ecs-user
      ECS_REMOTE_DIR: /var/www/52etf.vip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --prefer-offline --no-audit --no-fund

      - name: Build frontend bundle
        run: |
          npm run build
          test -d build
          rm -f 52etf_fe.tgz
          tar czf 52etf_fe.tgz -C build .

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: 52etf-fe-artifact
          path: 52etf_fe.tgz

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ECS_SSH_KEY }}

      - name: Trust remote host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts

      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: 52etf-fe-artifact
          path: .

      - name: Upload bundle and replace remote web root
        run: |
          scp 52etf_fe.tgz "${ECS_USER}@${ECS_HOST}:/tmp/52etf_fe.tgz"
          ssh "${ECS_USER}@${ECS_HOST}" "set -e
          sudo mkdir -p ${ECS_REMOTE_DIR}
          sudo rm -rf ${ECS_REMOTE_DIR}/*
          sudo tar xzf /tmp/52etf_fe.tgz -C ${ECS_REMOTE_DIR}
          sudo find ${ECS_REMOTE_DIR} -type d -exec chmod 755 {} +
          sudo find ${ECS_REMOTE_DIR} -type f -exec chmod 644 {} +
          "
