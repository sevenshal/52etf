name: Backend Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: 52etf-api-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build and deploy quant_server.pyz
    runs-on: ubuntu-latest
    env:
      # 服务已迁移到本机(Rich)：52etf.vip 域名不变，SSH 经 frps 6022 端口转发到本机
      ECS_HOST: 52etf.vip
      ECS_PORT: "6022"
      ECS_USER: quantd
      ECS_TARGET: /tmp/quant_server.pyz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m venv .flow-build-venv
          ./.flow-build-venv/bin/pip install -U pip shiv

      - name: Build quant_server.pyz
        id: build-package
        run: |
          set -euo pipefail

          REQ_HASH="$(sha256sum requirements.txt | awk '{print $1}')"
          PY_TAG="$(.flow-build-venv/bin/python - <<'PY'
          import sys
          print(f"py{sys.version_info.major}{sys.version_info.minor}")
          PY
          )"
          DEPS_DIR=".flow-deps/${PY_TAG}-${REQ_HASH}"

          if [ ! -d "$DEPS_DIR" ]; then
            echo "[build] dependency cache miss: $DEPS_DIR"
            tmp_dir="${DEPS_DIR}.tmp"
            rm -rf "$tmp_dir"
            mkdir -p "$tmp_dir"
            .flow-build-venv/bin/python -m pip install --target "$tmp_dir" -r requirements.txt
            mkdir -p .flow-deps
            mv "$tmp_dir" "$DEPS_DIR"
          else
            echo "[build] dependency cache hit: $DEPS_DIR"
          fi

          rm -rf build_dist quant_server.pyz
          mkdir -p build_dist
          cp -a "$DEPS_DIR"/. build_dist/
          cp -r src build_dist/src
          touch build_dist/src/__init__.py
          .flow-build-venv/bin/shiv \
            --site-packages ./build_dist \
            -p '/usr/bin/env python3' \
            -o quant_server.pyz \
            -e src.app.main:start \
            --build-id "$(date +%s)"

          ls -lh quant_server.pyz

      - name: Prepare SSH key
        shell: bash
        run: |
          if [ -z "${{ secrets.ECS_SSH_KEY }}" ]; then
            echo "ECS_SSH_KEY is empty. Please set the repository secret ECS_SSH_KEY."
            exit 1
          fi
          mkdir -p ~/.ssh
          touch ~/.ssh/deploy_key
          cat <<'EOF' > ~/.ssh/deploy_key
          ${{ secrets.ECS_SSH_KEY }}
          EOF
          perl -pi -e 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Loaded key fingerprints:"
          ssh-keygen -l -f ~/.ssh/deploy_key

      - name: Trust remote host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$ECS_PORT" -H "$ECS_HOST" >> ~/.ssh/known_hosts

      - name: Verify SSH access
        run: |
          ssh -i ~/.ssh/deploy_key -p "$ECS_PORT" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "${ECS_USER}@${ECS_HOST}" 'echo SSH_OK'

      - name: Upload package to server
        run: |
          scp -i ~/.ssh/deploy_key -P "$ECS_PORT" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            quant_server.pyz "${ECS_USER}@${ECS_HOST}:${ECS_TARGET}"

      - name: Install and restart remote service
        run: |
          ssh -i ~/.ssh/deploy_key -p "$ECS_PORT" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "${ECS_USER}@${ECS_HOST}" 'set -e
          BACKEND=/home/quantd/quant_prod/backend
          PY=/home/quantd/.local/share/uv/python/cpython-3.12-linux-x86_64-gnu/bin/python3.12
          install -m 0755 /tmp/quant_server.pyz "$BACKEND/quant_server.pyz.new"
          rm -rf "$BACKEND/_pyz_extract.new"
          mkdir -p "$BACKEND/_pyz_extract.new"
          "$PY" -m zipfile -e "$BACKEND/quant_server.pyz.new" "$BACKEND/_pyz_extract.new/"
          rm -rf "$BACKEND/site-packages.old"
          if [ -d "$BACKEND/site-packages" ]; then mv "$BACKEND/site-packages" "$BACKEND/site-packages.old"; fi
          mv "$BACKEND/_pyz_extract.new/site-packages" "$BACKEND/site-packages"
          rm -rf "$BACKEND/_pyz_extract.new"
          mv "$BACKEND/quant_server.pyz.new" "$BACKEND/quant_server.pyz"
          systemctl --user restart quant-server
          sleep 5
          systemctl --user --no-pager --lines=8 status quant-server
          rm -rf "$BACKEND/site-packages.old"
          '

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
