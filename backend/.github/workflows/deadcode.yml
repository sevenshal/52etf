name: Backend Deadcode Check

on:
  push:
  pull_request:

jobs:
  deadcode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare project venv
        run: |
          python -m venv ../.venv
          source ../.venv/bin/activate
          python -m pip install -U pip
          pip install -r requirements-dev.txt

      - name: Run deadcode checks
        run: |
          make deadcode
